.chip.ai{color:#1d1d1b;opacity:.4}
.zl{position:absolute;bottom:0}

.qz{display:flex;flex-direction:column;gap:2vh;width:100%}.qr2{display:flex;justify-content:space-between;align-items:center;gap:3vw}.qb{display:flex;gap:1vw}

.dw{display:flex;gap:2vw;width:100%;align-items:stretch}.dw .ed{flex:1.5}.res{flex:1;background:#fff;padding:2.5vmin 3vmin;display:flex;flex-direction:column;gap:2vh;justify-content:center}

.bn,.on .bn{animation:none;transition:opacity .5s}.rev .bn{opacity:1}

:root {
  --xl:clamp(3.65rem,6.3vw,6.55rem);
  --m:clamp(1.25rem,1.75vw,1.9rem);
  --s:clamp(.82rem,1.04vw,1.08rem);
  --e:cubic-bezier(.16,1,.3,1);
  --paper:#f7f6f3;
  --ink:#171b1e;
  --red:#c51821;
  --line:rgba(27,33,36,.12);
}
html,body {background:var(--paper);font-family:Inter,"Helvetica Neue",Arial,system-ui,sans-serif;}
body {letter-spacing:-.012em;}
.slide {
  --bg:var(--paper);--fg:var(--ink);--ac:var(--red);--mu:#65676a;
  padding:12.5vh 6vw 11vh;
  align-items:flex-start;
  gap:clamp(14px,2.6vh,26px);
  background:
    radial-gradient(ellipse 48vw 65vh at 109% -10%,rgba(197,24,33,.048),transparent 73%),
    radial-gradient(ellipse 45vw 60vh at -12% 112%,rgba(0,0,0,.032),transparent 70%),
    var(--bg);
  transform:translateY(12px) scale(.994);
  transition:opacity .52s ease,visibility .52s ease,transform .72s var(--e);
  isolation:isolate;
}
.slide.on{transform:none;}
.slide::before {
  content:"";pointer-events:none;position:absolute;inset:0;z-index:0;
  background-image:linear-gradient(90deg,rgba(21,27,30,.027) 1px,transparent 1px);
  background-size:calc(100% / 12) 100%;
  mask-image:linear-gradient(90deg,transparent,black 14%,black 86%,transparent);
  opacity:.42;
}
.slide::after {
  content:"";pointer-events:none;position:absolute;z-index:0;
  right:-10vw;top:-28vh;width:min(45vw,650px);aspect-ratio:1;
  border:1px solid rgba(197,24,33,.08);border-radius:50%;
  box-shadow:0 0 0 7vw rgba(197,24,33,.012),0 0 0 13vw rgba(197,24,33,.009);
}
.slide>*{z-index:1;}
.slide>.pic {z-index:1;}

.slide:nth-of-type(19)>.s{font-size:clamp(.82rem,1.04vw,1.1rem);}
.slide:nth-of-type(21){
  --bg:#14191d;--fg:#f6f4f0;--mu:#aeb3b6;--ac:#ff4b58;
  background:
   radial-gradient(ellipse 40vw 65vh at 90% 55%,rgba(197,24,33,.17),transparent 75%),
   radial-gradient(ellipse 35vw 40vh at 8% 105%,rgba(255,255,255,.045),transparent 78%),var(--bg);
}
.slide:nth-of-type(21)::after{right:5%;top:11%;width:36vw;border-color:rgba(255,255,255,.10);box-shadow:0 0 0 6vw rgba(255,255,255,.013),0 0 0 12vw rgba(255,255,255,.011);}
.slide:nth-of-type(21)::before{opacity:.12;}
.slide:nth-of-type(21) h1{font-size:clamp(3.8rem,6.5vw,7rem);line-height:1;}
.slide:nth-of-type(21) h1 .ac{color:#ff4b58;}
.slide:nth-of-type(21)>.m{max-width:26em;color:#e1e3e2;}
.slide:nth-of-type(22) .m{font-size:clamp(1.2rem,1.5vw,1.55rem);line-height:1.7;}
.slide:nth-of-type(22) .m .s{line-height:1.4;}
.slide:nth-of-type(22) a{text-decoration-thickness:1px;text-underline-offset:4px;}
.slide:nth-of-type(22)>.pic{right:auto;left:4vw;bottom:9vh;height:min(60vh,540px);}
.slide:nth-of-type(22){padding-left:calc(4vw + min(60vh,540px)*.75 + 4vw);}
.slide:nth-of-type(15)>.pic.bdg{height:min(24vh,220px);right:9vw;top:17vh;}

@media(max-height:760px) and (min-width:701px){
  :root{--xl:clamp(3.1rem,5.5vw,5.8rem);--m:clamp(1.1rem,1.6vw,1.6rem);}
  .slide{gap:clamp(8px,1.8vh,14px);padding-top:11vh;padding-bottom:9.5vh;}
  .g>div{min-height:140px;padding:13px;}.g .ic{width:33px;height:33px;}
  .r{min-height:65px;}.r h2{font-size:clamp(2.65rem,4.2vw,4.2rem);}

  #footer{bottom:2.8vh;}#hud{bottom:2vh;}
}

  html,body{overflow:hidden;}
  :root{--xl:clamp(2.6rem,9.2vw,4.2rem);--m:clamp(1.04rem,3.9vw,1.4rem);--s:clamp(.68rem,2.3vw,.9rem);}
  .slide{padding:12vh 5vw 10vh;gap:clamp(10px,2vh,16px);}
  .slide::after{opacity:.24;}
  .slide>.m,.slide>.a.m{font-size:clamp(1rem,3.8vw,1.3rem);}
  .g{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .g>div{min-height:110px;padding:13px;gap:7px;}

  .g .m{font-size:clamp(1.1rem,3.65vw,1.4rem);}
  .g .s{font-size:clamp(.75rem,2.45vw,.95rem);}
  .r{min-height:58px;align-items:center;gap:8px;}
  .r h2{font-size:clamp(2rem,7vw,3rem);}
  .r .ic{width:31px;height:31px;}
  .r .s{font-size:.78rem;max-width:10em;}
  .slide:has(>.r)>h2{font-size:clamp(2.5rem,7.8vw,3.5rem);}
  .cols>.ci{min-height:60px;padding:10px;}
  .ci{font-size:clamp(.85rem,3vw,1.15rem);}
  .ci .ic{width:25px;height:25px;}
  .dw{display:flex;flex-direction:column;min-height:0;gap:10px;}
  .dw .ed{flex:2;}.dw .res{flex:1;min-height:80px;}
  .ed pre,.ed .cd,.pr{font-size:clamp(.75rem,2.3vw,.95rem);}
  #cd{min-height:5em;padding:10px 14px;}
  .qr2{padding:8px;gap:10px;}
  .qr2 .m{font-size:clamp(.87rem,2.9vw,1.12rem);}
  .qb .btn{min-width:45px;padding:6px;}
  .btn{min-height:32px;font-size:clamp(.7rem,2.35vw,.9rem);}
  .pic.bdg{height:21vh;right:7vw;top:65vh;}
  .slide:nth-of-type(15)>.pic.bdg{height:11vh;right:6vw;top:15vh;}
  .slide:nth-of-type(22){padding-left:6vw;}
  .pic:not(.bdg){height:25vh;right:3vw;}
  .slide:first-of-type h1{font-size:clamp(3.4rem,11vw,5.4rem);}
  .slide:nth-of-type(14) .r{min-height:49px;}
  .slide:nth-of-type(14) .r h2{font-size:clamp(1.9rem,6.1vw,2.75rem);}
  .slide:nth-of-type(19)>.n{font-size:clamp(7rem,23vw,12rem);}
  #footer{bottom:3.9vh;left:5vw;font-size:9px;}
  #footer span{display:none;}
  #hud{bottom:2vh;right:5vw;font-size:10px;gap:6px;}
  #hud button{height:31px;width:31px;font-size:22px;}
  #sym{left:5vw;}#top{right:5vw;}
}

  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@keyframes wowIn{0%{opacity:0;filter:blur(18px);transform:scale(.35) rotate(-8deg)}55%{opacity:1;filter:blur(0);transform:scale(1.2) rotate(2.5deg)}100%{opacity:1;filter:none;transform:none}}
@keyframes shine{from{background-position:125% 0}to{background-position:-25% 0}}
.cand .ci.hit{animation:candPop .8s cubic-bezier(.2,1.6,.3,1)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
#fx i{position:absolute;display:block;will-change:transform,opacity}
#fx svg{display:block;width:100%;height:100%}
#fx .halo{border-radius:50%;background:radial-gradient(circle,rgba(255,196,60,.75) 0%,rgba(255,196,60,.28) 40%,rgba(255,196,60,0) 70%)}
#fx .ring{border-radius:50%;border:3px solid #ffb800}
@media(prefers-reduced-motion:reduce){#fx{display:none}#bl.wow{animation:none;-webkit-text-fill-color:currentColor;background:none}}

const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fxLayer(){let f=$('#fx');if(!f){f=document.createElement('div');f.id='fx';document.body.appendChild(f)}return f}
function clearFx(){tokT.forEach(clearTimeout);tokT=[];const f=$('#fx');if(f)f.innerHTML='';const b=$('#bl');if(b){b.classList.remove('wow');const l=b.closest('.l');if(l)l.style.overflow=''}}
function mkStar(F,x,y,sz,c){const e=document.createElement('i');e.innerHTML=STAR;e.style.cssText=`left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px;color:${c};filter:drop-shadow(0 0 ${sz/3}px ${c})`;F.appendChild(e);return e}
function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:el.offsetWidth,h:el.offsetHeight}}
const PAL=['#c51821','#ff5a61','#ffb800','#ffd45c','#ff8a3d','#1d1d1b'];
function burst(el,n,p){const F=fxLayer(),o=center(el),u=Math.min(innerWidth,innerHeight*1.6);
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,d=u*(.08+Math.random()*.26)*p,sz=(10+Math.random()*26)*Math.max(.6,p),c=PAL[k%PAL.length];
    const e=mkStar(F,o.x+Math.cos(a)*o.w*.2,o.y,sz,c),dx=Math.cos(a)*d*1.4,dy=Math.sin(a)*d,rot=(Math.random()-.5)*540;
    const an=e.animate([{transform:'translate(0,0) scale(0) rotate(0deg)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(1) rotate(${rot*.6}deg)`,opacity:1,offset:.45},{transform:`translate(${dx*1.12}px,${dy*1.12+u*.06}px) scale(0) rotate(${rot}deg)`,opacity:0}],{duration:1100+Math.random()*900,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
    an.onfinish=()=>e.remove()}}
function twinkle(el,n){const F=fxLayer(),o=center(el);
  for(let k=0;k<n;k++){const x=o.x+(Math.random()-.5)*(o.w+o.h*1.6),y=o.y+(Math.random()-.5)*o.h*1.9,sz=8+Math.random()*20,e=mkStar(F,x,y,sz,PAL[(k+2)%5]);e.style.opacity=0;
    const an=e.animate([{transform:'scale(0) rotate(0deg)',opacity:0},{transform:'scale(1) rotate(90deg)',opacity:1,offset:.5},{transform:'scale(0) rotate(180deg)',opacity:0}],{duration:800+Math.random()*900,delay:300+Math.random()*2600,iterations:2,easing:'ease-in-out'});
    an.onfinish=()=>e.remove()}}
function pulse(el){const F=fxLayer(),o=center(el);
  const mk=(cls,sz,dur,dl)=>{const e=document.createElement('i');e.className=cls;e.style.cssText=`left:${o.x-sz/2}px;top:${o.y-sz/2}px;width:${sz}px;height:${sz}px`;F.appendChild(e);
    const an=e.animate([{transform:'scale(.15)',opacity:.95},{transform:'scale(1)',opacity:0}],{duration:dur,delay:dl,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});an.onfinish=()=>e.remove()};
  const s=Math.max(o.w,o.h)*2.6;mk('halo',s,1500,0);mk('ring',s*.8,1100,60);mk('ring',s*1.25,1400,220)}
function wow(b){const l=b.closest('.l');if(l)l.style.overflow='visible';

  border(){cancelAnimationFrame(raf);const ln=$('#ln'),ch=$$('.chip'),t0=performance.now();

  count(s){$$('[data-n]',s).forEach(e=>{const N=+e.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0-500)/1600);e.textContent=Math.round(N*(1-Math.pow(1-Math.max(p,0),3)))+e.dataset.u;if(p<1)requestAnimationFrame(f)})(t0)})}
};
