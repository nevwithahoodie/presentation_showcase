<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICTe AI · Confini in movimento · ITS Alto Adriatico</title>
<style>
:root{--bg:#faf8f6;--fg:#1d1d1b;--mut:#5f5e5a;--c:#c51821;--nev:#c51821;--fede:#1d1d1b;--sam:#c51821;--ok:#16a34a;--bad:#dc2626;--dir:1;--line:#e4e0da}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:-20%;z-index:0;background:radial-gradient(circle at 15% 20%,color-mix(in srgb,var(--c) 16%,transparent),transparent 42%),radial-gradient(circle at 88% 85%,rgba(197,24,33,.1),transparent 40%);transition:background 1s}
#bg{position:fixed;inset:0;z-index:0}
.slide{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:11vh 6vw 9vh;text-align:center;opacity:0;visibility:hidden;transform:translateX(calc(var(--dir)*7vw)) scale(1.07);filter:blur(14px);transition:all .8s cubic-bezier(.2,.8,.2,1)}
.slide.on{opacity:1;visibility:visible;transform:none;filter:none}
.a{opacity:0}.on .a{animation:up .85s cubic-bezier(.2,.9,.2,1) var(--d,0s) both}
@keyframes up{from{opacity:0;transform:translateY(5vh) scale(.94)}to{opacity:1;transform:none}}
h1{font-size:clamp(3.6rem,12vw,11.4rem);line-height:.93;font-weight:900;letter-spacing:-.04em}
h2{font-size:clamp(2.52rem,6.72vw,6.48rem);line-height:1;font-weight:900;letter-spacing:-.03em}
.sub{font-size:clamp(1.38rem,2.64vw,2.76rem);color:var(--mut);max-width:30em;line-height:1.3}.sub b{color:var(--fg)}
.g{background:linear-gradient(90deg,var(--fede),var(--sam));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:clamp(1.2rem,2.16vw,2.16rem);color:var(--c);font-weight:700}
.row{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;align-items:stretch;width:100%}
.card{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:2.6vmin;box-shadow:0 10px 30px rgba(29,29,27,.07);flex:1 1 18vw;max-width:28vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1vmin;font-size:clamp(1.2rem,2.16vw,2.16rem)}
.card svg{width:clamp(56px,9vmin,110px);height:auto}.card .e{font-size:clamp(2.88rem,7.20vmin,6.00rem);line-height:1}
.card h3{font-size:clamp(1.5rem,2.88vw,3rem);font-weight:800;line-height:1.1}.card p{color:var(--mut);font-size:1.02em;line-height:1.25}
.card.hl{border-color:var(--fede);box-shadow:0 0 0 4px rgba(197,24,33,.15),0 10px 30px rgba(29,29,27,.08)}
.sm .card{flex:1 1 12vw;max-width:20vw}.sm .card.st{flex:1 1 26vw;max-width:30vw}.st .n{font-size:clamp(2.6rem,6vw,6rem)}
.btn{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:1.2vmin 2.6vmin;font:inherit;font-size:clamp(1.2rem,2.04vw,2.04rem);cursor:pointer;color:inherit;transition:.25s}
.btn:hover,.btn:focus-visible{background:var(--c);color:#fff;transform:translateY(-3px)}
.n{font-size:clamp(2.88rem,7.8vw,7.8rem);font-weight:900;line-height:1;color:var(--c);letter-spacing:-.03em}
#who{position:fixed;top:2.4vh;left:2.4vw;z-index:6;display:flex;align-items:center;gap:.9vmin;padding:.6vmin 1.6vmin .6vmin .6vmin;border-radius:999px;background:#fff;border:2px solid var(--c);box-shadow:0 4px 14px rgba(29,29,27,.1);font-size:clamp(.9rem,1.35vw,1.35rem);font-weight:700}
#who i{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900;background:var(--c)}
#who small{display:block;color:var(--mut);font-size:.82em;font-weight:400}
#who.pop{animation:pop .7s cubic-bezier(.2,1.4,.3,1)}@keyframes pop{from{transform:scale(.6) translateX(-4vw);opacity:0}to{transform:none;opacity:1}}
#top{position:fixed;top:2.4vh;right:2.4vw;z-index:6;height:clamp(26px,4.6vh,48px);display:flex;align-items:center}#top img{height:100%}
.lt{font-size:clamp(1.32rem,2.4vw,2.4rem);font-weight:900;color:var(--fg)}
#bar{position:fixed;top:0;left:0;height:6px;width:0;background:linear-gradient(90deg,var(--fede),var(--sam));z-index:7;transition:width .8s cubic-bezier(.2,.8,.2,1)}
#hud{position:fixed;bottom:2.5vh;right:3vw;z-index:6;display:flex;gap:1vmin;align-items:center;color:var(--mut);font-size:clamp(1.1rem,1.7vw,1.7rem)}
#hud button{width:2.4em;height:2.4em;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit}#hud button:hover{background:var(--c);color:#fff}
#relay{position:fixed;inset:0;z-index:9;pointer-events:none;clip-path:inset(0 100% 0 0)}
#relay.go{animation:relay 1s cubic-bezier(.7,0,.3,1)}@keyframes relay{0%{clip-path:inset(0 100% 0 0)}45%,55%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
.logo{height:clamp(60px,14vh,150px)}
/* confine */
.track{position:relative;width:90%;height:44vh;border-radius:26px;border:1.5px solid var(--line);overflow:hidden;background:linear-gradient(90deg,rgba(197,24,33,.12),#fff 75%)}
#ln{position:absolute;top:0;bottom:0;left:6%;border-left:4px dashed var(--fg)}
#ln svg{position:absolute;top:50%;left:-3.2vmin;width:6.4vmin;transform:translateY(-50%);background:#fff;border-radius:50%;animation:spin 5s linear infinite}@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.chip{position:absolute;transform:translateX(-50%);padding:1vmin 2vmin;border-radius:999px;border:2px solid var(--nev);background:#fff;font-size:clamp(1rem,1.55vw,1.6rem);font-weight:700;white-space:nowrap;transition:.5s}
.chip.ai{background:var(--fede);border-color:var(--fede);color:#fff;transform:translateX(-50%) scale(1.08)}
.zl{position:absolute;bottom:2vh;font-size:clamp(1.3rem,2.4vw,2.4rem);font-weight:800}
/* pipeline */
.pipe .card{flex-basis:14vw;max-width:17vw;padding-bottom:7vmin;position:relative}
.band{position:absolute;left:0;right:0;bottom:0;height:5.4vmin;border-radius:0 0 22px 22px;display:grid;place-items:center;font-size:.8em;font-weight:800;color:#fff;transform-origin:bottom;opacity:0}
.on .band{animation:bd .6s cubic-bezier(.2,1.3,.3,1) var(--d) both}@keyframes bd{from{transform:scaleY(0)}to{transform:none;opacity:1}}
/* editor / bug */
.ed{width:min(1000px,92vw);background:#1d1d1b;border-radius:20px;text-align:left;overflow:hidden;box-shadow:0 30px 70px rgba(29,29,27,.3);position:relative}
.ed>div:first-child{display:flex;gap:.8vmin;padding:1.4vmin 2vmin;background:#2e2e2c}.ed>div:first-child i{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#f87171}.ed>div:first-child i:nth-child(2){background:#fbbf24}.ed>div:first-child i:nth-child(3){background:#4ade80}
.ed pre,.pr{font:clamp(1rem,1.9vw,1.9rem)/1.6 Consolas,"Courier New",monospace;padding:2vmin 3vmin;white-space:pre-wrap;color:#e7e5e4}
.pr{color:#fca5a5;border-bottom:1px solid #3d3d3a;min-height:2.4em}.pr::after,#cd::after{content:"▍";animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#cd{min-height:7.5em;display:block}
.cd{padding:1.5vmin 0;font:clamp(1rem,1.9vw,1.9rem)/1.6 Consolas,"Courier New",monospace;color:#e7e5e4}
.cd div{padding:0 3vmin;white-space:pre;border-left:5px solid transparent;opacity:0}
.on .cd div{animation:up .5s ease var(--d) both}
.on .cd .bad{animation:up .5s ease var(--d) both,flag .5s 3.6s forwards}@keyframes flag{to{background:rgba(220,38,38,.3);border-left-color:#f87171;color:#fff}}
.scan{position:absolute;left:0;right:0;height:5vh;top:6vh;background:linear-gradient(transparent,rgba(197,24,33,.4),transparent);opacity:0}
.on .scan{animation:sc 1.6s 2s ease-in-out both}@keyframes sc{0%{top:6vh;opacity:1}100%{top:92%;opacity:1}}
.note{font-size:clamp(1.32rem,2.4vw,2.4rem);font-weight:800;opacity:0}.on .note{animation:up .6s 3.8s both}
.ok{color:var(--ok)}.bd{color:var(--bad)}
/* pilot */
.pilot{width:min(96vh,92vw);height:auto;overflow:visible}
.bob{animation:bob 1.2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}
.l1{animation:bob .6s ease-in-out infinite alternate}.l2{animation:bob .6s .3s ease-in-out infinite alternate}
.wheel{transform-box:fill-box;transform-origin:center;animation:wh 2.4s ease-in-out infinite}@keyframes wh{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(32deg)}}
.eye{animation:eye 3.4s infinite;transform-box:fill-box;transform-origin:center}@keyframes eye{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.road{stroke-dasharray:36 30;animation:rd .9s linear infinite}.dash{stroke-dasharray:10 12;animation:rd 1.2s linear infinite}@keyframes rd{to{stroke-dashoffset:-66}}
.pulse{animation:pl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{50%{transform:scale(1.4);opacity:.5}}
/* ciclo */
.loop{width:min(60vh,84vw);height:auto}
.pill{transform-box:fill-box;transform-origin:center;animation:hl 6s ease-in-out infinite}@keyframes hl{0%,20%{transform:scale(1.15)}30%,100%{transform:none}}
.leg{display:flex;gap:3vmin;color:var(--mut);font-size:clamp(1.2rem,2vw,2rem)}.leg i{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.15em;margin-right:.4em}
/* token */
.bars{width:min(760px,88vw);display:flex;flex-direction:column;gap:1.2vmin;font-size:clamp(1.32rem,2.4vw,2.4rem);font-weight:700;text-align:left}
.bars div{display:flex;align-items:center;gap:2vmin}.bars span{width:5.5em}.bars b{height:3.4vmin;border-radius:99px;background:#cbd5e1;width:0}
.on .bars b{animation:gr 1.2s cubic-bezier(.2,.9,.2,1) var(--d) forwards}@keyframes gr{to{width:var(--w)}}.bars div:first-child b{background:var(--fede)}
.blank{display:inline-block;min-width:3.6em;border-bottom:5px solid var(--fede);color:var(--fede)}
.big{font-size:clamp(3.12rem,10.2vw,10.2rem);font-weight:900;letter-spacing:-.04em;line-height:1}
.qr{width:min(26vh,40vw);background:#fff;padding:1.6vmin;border-radius:18px;border:1.5px solid var(--line);box-shadow:0 10px 30px rgba(29,29,27,.1)}.qr img{display:block;width:100%}
.q{font-size:clamp(7rem,24vh,20rem);font-weight:900;line-height:.8;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-3vh) rotate(4deg)}}
.av{display:flex;gap:3vmin}.av div{display:flex;flex-direction:column;align-items:center;gap:1vmin;font-weight:800;font-size:clamp(1.2rem,2.16vw,2.16rem)}.av i{width:clamp(60px,12vmin,130px);height:clamp(60px,12vmin,130px);border-radius:50%;display:grid;place-items:center;color:#fff;font:900 clamp(1.8rem,5vmin,4rem) sans-serif}.av small{color:var(--mut);font-weight:400}
.bar2{display:flex;width:min(1000px,90vw);height:8vh;border-radius:18px;overflow:hidden;font-size:clamp(1.2rem,2.16vw,2.16rem);font-weight:800;color:#fff}
.bar2 div{display:grid;place-items:center;transform-origin:left;transform:scaleX(0)}.on .bar2 div{animation:sx 1s cubic-bezier(.2,.9,.2,1) var(--d) forwards}@keyframes sx{to{transform:none}}
.cn{transform-box:fill-box;transform-origin:center;animation:cn 2.6s ease-in-out infinite}@keyframes cn{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.18)}}
@media(max-width:700px){.card{max-width:90vw;flex-basis:44vw}.track{height:52vh}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

  const to=S[n].dataset.s,from=i<0?to:S[i].dataset.s;
  if(i>=0&&n>i&&from!==to){busy=true;const r=$('#relay');r.style.background=W[to][2];r.classList.remove('go');void r.offsetWidth;r.classList.add('go');
    setTimeout(()=>show(n),450);setTimeout(()=>busy=false,1000)}else show(n);
}

  border(){cancelAnimationFrame(raf);const ln=$('#ln'),ch=$$('.chip'),t0=performance.now();
    (function f(t){const p=Math.min(1,(t-t0)/7000),x=6+(1-Math.pow(1-p,3))*52;ln.style.left=x+'%';ch.forEach(c=>c.classList.toggle('ai',+c.dataset.x<x));if(p<1)raf=requestAnimationFrame(f)})(t0)},
  tok(){const b=$('#bl');b.textContent='';setTimeout(()=>{if(S[i].classList.contains('on'))b.textContent='idea'},2000)},

};

 b:['Fammi un timer di 25 minuti',"let s = 25 * 60;\nsetInterval(() => {\n  s--;\n  show(Math.floor(s / 60) + ':' + s % 60);\n}, 1000);"],

const cv=$('#bg'),x=cv.getContext('2d');let w,h,P=[];
function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight;P=Array.from({length:Math.min(80,w/18|0)},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}))}
function dr(){rgb=rgb.map((v,k)=>v+(tgt[k]-v)*.04);const c=rgb.map(Math.round).join(',');x.clearRect(0,0,w,h);
  P.forEach((p,a)=>{p.x=(p.x+p.vx+w)%w;p.y=(p.y+p.vy+h)%h;x.fillStyle=`rgba(${c},.5)`;x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill();
    for(let b=a+1;b<P.length;b++){const q=P[b],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){x.strokeStyle=`rgba(${c},${.2*(1-d/130)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});requestAnimationFrame(dr)}
